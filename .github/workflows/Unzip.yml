name: Unzip and commit archive

on:
  workflow_dispatch:
  push:
    paths:
      - 'shriasphere-podcast-website.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip archive
        run: |
          if [ -f "shriasphere-podcast-website.zip" ]; then
            unzip -o shriasphere-podcast-website.zip -d shriasphere
            if [ -d "shriasphere/shriasphere" ]; then
              mv shriasphere/shriasphere/* shriasphere/ || true
              rm -rf shriasphere/shriasphere || true
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add shriasphere || true
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Unzip shriasphere-podcast-website.zip"
              git push
            fi
          else
            echo "Zip file not found"
            exit 1
          fi
